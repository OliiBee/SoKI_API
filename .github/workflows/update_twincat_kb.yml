name: Update TwinCAT KB in CompanyGPT

"on":
  push:
    branches:
      - main
    paths:
      - '**.TcPOU'
      - '**.TcDUT'
      - '**.TcGVL'
      - '**.TcTask'
      - '**.tsproj'
      - 'parse_twincat.py'

  workflow_dispatch:

jobs:
  parse-and-upload:
    name: Parse TwinCAT & Upload to CompanyGPT KB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Repo auschecken ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python einrichten ────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests lxml

      # ── 3. TwinCAT-Dateien parsen ───────────────────────────────────────
      - name: Parse TwinCAT project files
        run: |
          python parse_twincat.py \
            --categories tasks,dut,gvl,libs,motion,pous \
            --output twincat_kb_payload.json
        env:
          REPO_ROOT: ${{ github.workspace }}

      # ── 4. Payload prüfen ───────────────────────────────────────────────
      - name: Show parsed summary
        run: |
          echo "=== TwinCAT KB Payload Summary ==="
          python3 -c "
          import json
          with open('twincat_kb_payload.json') as f:
              data = json.load(f)
          print(f'Kategorien: {list(data.keys())}')
          for k, v in data.items():
              items = v if isinstance(v, list) else []
              print(f'  {k}: {len(items)} Eintraege')
          "

      # ── 5. Upload zu CompanyGPT KB (Azure Cognitive Services) ───────────
      - name: Upload KB to CompanyGPT
        run: |
          python3 - <<'EOF'
          import json, requests, os, sys

          api_key   = os.environ["COMPANYGPT_API_KEY"]
          # Strip trailing slash
          api_url   = os.environ.get("COMPANYGPT_API_URL", "").rstrip("/")
          kb_folder = "KB-Agent-TwinCAT"

          if not api_url:
              print("❌ COMPANYGPT_API_URL ist nicht gesetzt!")
              sys.exit(1)

          with open("twincat_kb_payload.json") as f:
              payload = json.load(f)

          # Azure Cognitive Services: api-key Header (kein Bearer!)
          headers = {
              "api-key":        api_key,
              "Content-Type":   "application/json",
              "X-Source":       "github-actions",
          }

          success = 0
          errors  = 0

          for category, content in payload.items():
              doc_id   = f"twincat_{category.lower()}"
              doc_body = {
                  "folder":   kb_folder,
                  "id":       doc_id,
                  "title":    f"TwinCAT - {category.upper()}",
                  "content":  json.dumps(content, ensure_ascii=False, indent=2),
                  "tags":     ["twincat", "auto-generated", category.lower()],
                  "source":   f"github/{os.environ.get('GITHUB_REPOSITORY', 'SoKI_API')}",
                  "commit":   os.environ.get("GITHUB_SHA", "unknown")[:8],
              }

              url = f"{api_url}/documents/{doc_id}"
              print(f"  → PUT {url}")

              try:
                  resp = requests.put(url, headers=headers, json=doc_body, timeout=30)
                  if resp.status_code in (200, 201):
                      print(f"  ✅ {category}: OK ({resp.status_code})")
                      success += 1
                  else:
                      print(f"  ❌ {category}: FEHLER {resp.status_code} – {resp.text[:300]}")
                      errors += 1
              except Exception as e:
                  print(f"  ❌ {category}: Exception – {e}")
                  errors += 1

          print(f"\nErgebnis: {success} erfolgreich / {errors} Fehler")
          sys.exit(1 if errors > 0 else 0)
          EOF
        env:
          COMPANYGPT_API_KEY:  ${{ secrets.COMPANYGPT_API_KEY }}
          COMPANYGPT_API_URL:  ${{ vars.COMPANYGPT_API_URL }}
          GITHUB_SHA:          ${{ github.sha }}
          GITHUB_REPOSITORY:   ${{ github.repository }}

      # ── 6. Payload als Artefakt sichern ─────────────────────────────────
      - name: Save payload as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twincat-kb-payload-${{ github.run_number }}
          path: twincat_kb_payload.json
          retention-days: 7
