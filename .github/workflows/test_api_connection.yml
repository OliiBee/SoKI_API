name: Test CompanyGPT API Connection

"on":
  workflow_dispatch:

jobs:
  test-connection:
    name: Verify API reachability & auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Reachability ─────────────────────────────────────────────────
      - name: Check API reachability
        run: |
          echo "=== Step 1: Reachability ==="
          API_URL="${{ vars.COMPANYGPT_API_URL }}"
          API_URL="${API_URL%/}"
          echo "Host: $API_URL"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -I "$API_URL")

          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "❌ API nicht erreichbar"
            exit 1
          else
            echo "✅ Host erreichbar (HTTP $HTTP_CODE)"
          fi

      # ── 2. Auth-Test mit Bearer Token ───────────────────────────────────
      - name: Test authentication (Bearer)
        run: |
          echo "=== Step 2: Auth Test ==="
          API_URL="${{ vars.COMPANYGPT_API_URL }}"
          API_URL="${API_URL%/}"

          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 10 \
            -H "Authorization: Bearer ${{ secrets.COMPANYGPT_API_KEY }}" \
            -H "Content-Type: application/json" \
            "$API_URL/models")

          echo "HTTP Status: $RESPONSE"
          echo "Response Body:"
          cat response.json | python3 -m json.tool 2>/dev/null || cat response.json

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Authentifizierung erfolgreich"
          elif [ "$RESPONSE" = "401" ]; then
            echo "❌ 401 – API-Key ungültig"
            exit 1
          elif [ "$RESPONSE" = "403" ]; then
            echo "❌ 403 – Keine Berechtigung"
            exit 1
          else
            echo "⚠️  Status: $RESPONSE"
            exit 1
          fi

      # ── 3. Files-Endpunkt prüfen ─────────────────────────────────────
      - name: Test /files endpoint
        run: |
          echo "=== Step 3: /files Endpoint ==="
          API_URL="${{ vars.COMPANYGPT_API_URL }}"
          API_URL="${API_URL%/}"

          RESPONSE=$(curl -s -o files.json -w "%{http_code}" \
            --max-time 15 \
            -H "Authorization: Bearer ${{ secrets.COMPANYGPT_API_KEY }}" \
            -H "Content-Type: application/json" \
            "$API_URL/files")

          echo "HTTP Status: $RESPONSE"
          cat files.json | python3 -m json.tool 2>/dev/null || cat files.json

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ /files erreichbar"
          else
            echo "⚠️  /files Status: $RESPONSE – evtl. anderer Endpunkt nötig"
          fi

      # ── 4. Zusammenfassung ──────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          API_URL="${{ vars.COMPANYGPT_API_URL }}"
          API_URL="${API_URL%/}"
          echo ""
          echo "════════════════════════════════════════"
          echo 
