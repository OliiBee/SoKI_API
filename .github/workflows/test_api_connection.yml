name: Test CompanyGPT API Connection

"on":
  workflow_dispatch:

jobs:
  test-connection:
    name: Verify API reachability & auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Reachability – Base-URL ohne Slash-Problem ───────────────────
      - name: Check API reachability (HEAD)
        run: |
          echo "=== Step 1: Reachability ==="
          # Strip trailing slash
          API_URL="${{ vars.COMPANYGPT_API_URL }}"
          API_URL="${API_URL%/}"
          echo "Calling: $API_URL"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -I "$API_URL")

          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "❌ API nicht erreichbar"
            exit 1
          else
            echo "✅ Host erreichbar (HTTP $HTTP_CODE)"
          fi

      # ── 2. Auth-Test – Azure Cognitive Services verwendet api-key ───────
      - name: Test authentication (Azure api-key)
        run: |
          echo "=== Step 2: Auth Test ==="
          API_URL="${{ vars.COMPANYGPT_API_URL }}"
          API_URL="${API_URL%/}"

          # Azure Cognitive Services: api-key Header statt Bearer
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 10 \
            -H "api-key: ${{ secrets.COMPANYGPT_API_KEY }}" \
            -H "Content-Type: application/json" \
            "$API_URL/openai/deployments?api-version=2024-02-01")

          echo "HTTP Status: $RESPONSE"
          echo "Response Body:"
          cat response.json | python3 -m json.tool 2>/dev/null || cat response.json

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Authentifizierung erfolgreich (api-key)"
          elif [ "$RESPONSE" = "401" ]; then
            echo "❌ 401 – API-Key ungültig"
            exit 1
          elif [ "$RESPONSE" = "403" ]; then
            echo "❌ 403 – Keine Berechtigung"
            exit 1
          elif [ "$RESPONSE" = "404" ]; then
            echo "⚠️  404 – Endpunkt nicht gefunden, versuche Fallback..."
          else
            echo "⚠️  Status: $RESPONSE"
          fi

      # ── 3. Fallback – Bearer Token testen ───────────────────────────────
      - name: Test authentication (Bearer fallback)
        run: |
          echo "=== Step 3: Bearer Fallback ==="
          API_URL="${{ vars.COMPANYGPT_API_URL }}"
          API_URL="${API_URL%/}"

          RESPONSE=$(curl -s -o bearer_response.json -w "%{http_code}" \
            --max-time 10 \
            -H "Authorization: Bearer ${{ secrets.COMPANYGPT_API_KEY }}" \
            -H "Content-Type: application/json" \
            "$API_URL/openai/deployments?api-version=2024-02-01")

          echo "HTTP Status: $RESPONSE"
          cat bearer_response.json | python3 -m json.tool 2>/dev/null || cat bearer_response.json

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Bearer Auth erfolgreich"
          else
            echo "ℹ️  Bearer Status: $RESPONSE"
          fi

      # ── 4. Zusammenfassung ──────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          API_URL="${{ vars.COMPANYGPT_API_URL }}"
          API_URL="${API_URL%/}"
          echo ""
          echo "════════════════════════════════════════"
          echo "  CompanyGPT API Connection Test"
          echo "  Host: $API_URL"
          echo "  Run:  #${{ github.run_number }}"
          echo "════════════════════════════════════════"
