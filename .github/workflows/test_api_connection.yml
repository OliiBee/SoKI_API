name: Test CompanyGPT API Connection

"on":
  workflow_dispatch:   # Nur manuell auslösbar – kein automatischer Trigger

jobs:
  test-connection:
    name: Verify API reachability & auth
    runs-on: ubuntu-latest

    steps:
      # ── 1. Repo auschecken ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Reachability prüfen (kein Auth, nur HTTP-Status) ─────────────
      - name: Check API reachability (HEAD)
        run: |
          echo "=== Step 1: Reachability ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            -I "${{ vars.COMPANYGPT_API_URL }}/health")
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "❌ API nicht erreichbar – URL prüfen: ${{ vars.COMPANYGPT_API_URL }}"
            exit 1
          else
            echo "✅ API erreichbar (HTTP $HTTP_CODE)"
          fi

      # ── 3. Auth-Test gegen /health ──────────────────────────────────────
      - name: Test authentication (Bearer Token)
        run: |
          echo "=== Step 2: Auth Test ==="
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 10 \
            -H "Authorization: Bearer ${{ secrets.COMPANYGPT_API_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ vars.COMPANYGPT_API_URL }}/health")

          echo "HTTP Status: $RESPONSE"
          echo "Response Body:"
          cat response.json || echo "(leer)"

          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "204" ]; then
            echo "✅ Authentifizierung erfolgreich"
          elif [ "$RESPONSE" = "401" ]; then
            echo "❌ 401 Unauthorized – API-Key ungültig oder abgelaufen"
            exit 1
          elif [ "$RESPONSE" = "403" ]; then
            echo "❌ 403 Forbidden – Key gültig, aber keine Berechtigung"
            exit 1
          else
            echo "⚠️  Unerwarteter Status: $RESPONSE"
            exit 1
          fi

      # ── 4. Endpunkt /v1/files prüfen ────────────────────────────────────
      - name: Test /v1/files endpoint
        run: |
          echo "=== Step 3: Endpoint /v1/files ==="
          RESPONSE=$(curl -s -o files.json -w "%{http_code}" \
            --max-time 15 \
            -H "Authorization: Bearer ${{ secrets.COMPANYGPT_API_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ vars.COMPANYGPT_API_URL }}/files")

          echo "HTTP Status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ /v1/files erreichbar"
            echo "--- Felder in der Antwort ---"
            python3 -c "
          import json
          with open('files.json') as f:
              data = json.load(f)
          if isinstance(data, list):
              print(f'Typ: Liste mit {len(data)} Einträgen')
              if len(data) > 0:
                  print(f'Felder: {list(data[0].keys())}')
          elif isinstance(data, dict):
              print(f'Typ: Objekt')
              print(f'Felder: {list(data.keys())}')
          " || echo "(JSON-Parse fehlgeschlagen)"
          else
            echo "⚠️  /v1/files Status: $RESPONSE"
            cat files.json || true
          fi

      # ── 5. Zusammenfassung ──────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════"
          echo "  CompanyGPT API Connection Test"
          echo "  API URL: ${{ vars.COMPANYGPT_API_URL }}"
          echo "  Secret:  COMPANYGPT_API_KEY (gesetzt: ${{ secrets.COMPANYGPT_API_KEY != '' }})"
          echo "  Repo:    ${{ github.repository }}"
          echo "  Run:     #${{ github.run_number }}"
          echo "════════════════════════════════════"
